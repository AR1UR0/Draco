#  @author Thais
#  @version 1.4.0
services:
  # --- APPLICATION SERVICE (PHP) ---
  # Manages the web server and the processing of the application logic
  php:
    build:
      context: ../
      dockerfile: Despliegue/Dockerfile # Custom build from the deployment folder
    ports:
      - "80:80" # Standard HTTP
      - "443:443" # HTTPS for secure connections
    env_file:
      - ./.env # Loading of global environment variables
    networks:
      draco:
        aliases:
          - draco.com # Internal network alias for domain resolution
    depends_on:
      mysql:
        condition: service_healthy # The application only starts when the database is ready

  # --- DATABASE SERVICE (MYSQL) ---
  # Relational storage for all system data
  mysql:
    image: mysql:9.6 # Specific version of the official MySQL image
    ports:
      - 3306:3306 # Default port for external connections if necessary
    env_file:
      - ./.env
    networks:
      draco:
        aliases:
          - mysql.draco.com
    volumes:
      - ./db_data:/var/lib/mysql # Data persistence in the local directory to avoid loss
    healthcheck:
      # Verification of MySQL status to ensure it accepts connections
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # --- MANAGEMENT SERVICE (PHPMYADMIN) ---
  # Web-based graphical interface for database administration
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - 8081:80 # Accessible via port 8081 of the host machine
    environment:
      PMA_HOST: mysql # Links directly to the database container
    networks:
      draco:
        aliases:
          - phpmyadmin.draco.com
    depends_on:
      mysql:
        condition: service_healthy # Waits for the database to be available

# --- NETWORK CONFIGURATION ---
# Isolated network for secure communication between containers
networks:
  draco:
    name: draco
    driver: bridge # Bridge-type driver for internal connectivity
