<IfModule mod_ssl.c>
    <VirtualHost _default_:443>
        ServerAdmin webmaster@localhost
        # Ruta al public de tu proyecto DracoLaravel
        DocumentRoot /var/www/html/Draco/DracoLaravel/public
        
        RewriteEngine On
        RewriteCond %{HTTPS} off
        RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

        # Configuración SSL
        SSLEngine on
        SSLCertificateFile    /etc/ssl/certs/server.crt
        SSLCertificateKeyFile /etc/ssl/private/server.key

        <Directory /var/www/html/Draco/DracoLaravel/public>
            Options -Indexes +FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>

        # ii. Configurar documentos de error (apuntan al index de Laravel)
        ErrorDocument 404 /404.blade.php
        ErrorDocument 500 /500.blade.php

        # i. Impedir acceso a archivos privados
        # Bloquea archivos sensibles, documentación y el propio .env
        <FilesMatch "^(README\.md|composer\.(json|lock)|package\.(json|lock)|\.env.*)$">
            Require all denied
        </FilesMatch>

        # Bloquea carpetas ocultas (como .git)
        <DirectoryMatch "/\.(git|github|svn)/">
            Require all denied
        </DirectoryMatch>

        BrowserMatch "MSIE [2-6]" \
                nokeepalive ssl-unclean-shutdown \
                downgrade-1.0 force-response-1.0

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
    </VirtualHost>
</IfModule>