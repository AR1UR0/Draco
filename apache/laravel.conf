# -------------------------------------------------------------------------
# CONFIGURACIÓN PUERTO 80 (Redirección a HTTPS)
# -------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/Draco/DracoLaravel/public

    # iii. Configurar el sitio web para usar HTTPS siempre.
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# -------------------------------------------------------------------------
# CONFIGURACIÓN PUERTO 443 (HTTPS y Seguridad)
# -------------------------------------------------------------------------
<IfModule mod_ssl.c>
    <VirtualHost *:443>
        Alias /draco /var/www/html/Draco/DracoLaravel/public
        ServerAdmin admin@localhost
        DocumentRoot /var/www/html/Draco/DracoLaravel/public

        ErrorDocument 400 "https://localhost:443/"

        # Configuración de Certificados (Copiados en el Dockerfile)
        SSLEngine on
        SSLCertificateFile    /etc/ssl/certs/server.crt
        SSLCertificateKeyFile /etc/ssl/private/server.key

        <Directory /var/www/html/Draco/DracoLaravel/public>
            Options -Indexes +FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>

        # i. Impedir el acceso a los archivos privados empleados por la web
        # Bloquea acceso a documentación, archivos de configuración y git
        <FilesMatch "^(README\.md|composer\.(json|lock)|package\.(json|lock)|\.env.*|artisan)$">
            Require all denied
        </FilesMatch>

        <DirectoryMatch "/\.(git|github|svn)/">
            Require all denied
        </DirectoryMatch>

        # ii. Configurar un documento de error 404 y 500
        # En Laravel, lo ideal es dejar que el framework los maneje,
        # pero para cumplir la regla por Apache:
        # ErrorDocument 404 /error404.html
        # ErrorDocument 500 /error500.html

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
    </VirtualHost>
</IfModule>