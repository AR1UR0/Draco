<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>404 - Página no encontrada | Draco Project</title>
		<style>
			:root {
				--primary-color: #ff4d4d; /* Un rojo dragón */
				--bg-color: #0f172a;
				--text-color: #f8fafc;
			}

			body {
				margin: 0;
				padding: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				height: 100vh;
				background-color: var(--bg-color);
				color: var(--text-color);
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
				overflow: hidden;
			}

			.container {
				text-align: center;
				z-index: 1;
			}

			.error-code {
				font-size: 10rem;
				font-weight: 900;
				margin: 0;
				line-height: 1;
				background: linear-gradient(180deg, var(--primary-color), #550000);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				filter: drop-shadow(0 0 15px rgba(255, 77, 77, 0.3));
				animation: float 3s ease-in-out infinite;
			}

			.message {
				font-size: 1.5rem;
				margin-top: 1rem;
				opacity: 0.8;
			}

			.description {
				margin: 1rem 0 2rem;
				font-size: 1rem;
				color: #94a3b8;
			}

			.btn {
				display: inline-block;
				padding: 0.75rem 1.5rem;
				background-color: var(--primary-color);
				color: white;
				text-decoration: none;
				border-radius: 8px;
				font-weight: bold;
				transition:
					transform 0.2s,
					background-color 0.2s;
				box-shadow: 0 4px 15px rgba(255, 77, 77, 0.4);
			}

			.btn:hover {
				background-color: #ff3333;
				transform: translateY(-3px);
			}

			/* Animación de flotado */
			@keyframes float {
				0%,
				100% {
					transform: translateY(0);
				}
				50% {
					transform: translateY(-20px);
				}
			}

			/* Fondo decorativo (Efecto de humo o fuego) */
			.fire-bg {
				position: absolute;
				bottom: -50px;
				width: 100%;
				height: 300px;
				background: radial-gradient(
					circle,
					rgba(255, 77, 77, 0.1) 0%,
					transparent 70%
				);
				filter: blur(50px);
				z-index: 0;
			}
		</style>
	</head>
	<body>
		<div class="fire-bg"></div>

		<div class="container">
			<h1 class="error-code">404</h1>
			<p class="message">¡Vaya! El dragón se ha llevado esta página.</p>
			<p class="description">
				Lo que buscas ya no está en la guarida o nunca existió.
			</p>
			<a href="/" class="btn">Volver al Inicio</a>
		</div>
	</body>
</html>
